<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Text Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Outer Glow Ring -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)" />

  <!-- Bold Typography Text: LM (Lawino Meet) -->
  <text x="64" y="82" 
        text-anchor="middle" 
        font-family="'Outfit', 'Montserrat', 'Inter', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="58" 
        letter-spacing="-3"
        fill="url(#textGrad)"
        filter="url(#glow)">LM</text>
</svg>