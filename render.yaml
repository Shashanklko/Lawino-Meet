services:
  # 1. Spring Boot Backend Web Service (Docker Container)
  - type: web
    name: lawinomeet-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile

  # 2. React TypeScript Frontend Static Site
  - type: web
    name: lawinomeet-frontend
    env: static
    plan: free
    rootDir: LawinoMeet-Frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
