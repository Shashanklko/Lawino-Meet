# yaml-language-server: $schema=https://json.schemastore.org/render.json
services:
  # 1. Spring Boot Backend Web Service (Docker Container)
  - type: web
    name: lawinomeet-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"

  # 2. React TypeScript Frontend Static Site (Free by default)
  - type: web
    name: lawinomeet-frontend
    runtime: static
    rootDir: LawinoMeet-Frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
