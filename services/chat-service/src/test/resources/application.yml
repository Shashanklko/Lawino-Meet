server:
  port: 0

spring:
  application:
    name: chat-service-test
  datasource:
    url: jdbc:h2:mem:chat_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: super-secret-jwt-key-change-this-in-production-min-256-bits-length
    issuer: lawino-meet
