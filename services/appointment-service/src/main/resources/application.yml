server:
  port: ${APPOINTMENT_SERVICE_PORT:8083}

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${APPOINTMENT_DB_NAME:appointment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-jwt-key-change-this-in-production-min-256-bits-length}
    issuer: ${JWT_ISSUER:lawino-meet}
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
    meeting-service-url: ${MEETING_SERVICE_URL:http://localhost:8084}
